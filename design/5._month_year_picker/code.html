<!-- Audio click synthetic trigger & interactivity script -->
<script>
    (function initMonthYearPicker() {
      let selectedYear = 2025;
      let selectedMonth = 'OCT';

      const yearDisplay = document.getElementById('current-year-display');
      const summaryDisplay = document.getElementById('selected-summary');
      const yearChips = document.querySelectorAll('.year-chip');
      const monthCells = document.querySelectorAll('.month-cell');

      const monthNames = {
        'JAN': 'JANUARY', 'FEB': 'FEBRUARY', 'MAR': 'MARCH',
        'APR': 'APRIL', 'MAY': 'MAY', 'JUN': 'JUNE',
        'JUL': 'JULY', 'AUG': 'AUGUST', 'SEP': 'SEPTEMBER',
        'OCT': 'OCTOBER', 'NOV': 'NOVEMBER', 'DEC': 'DECEMBER'
      };

      function updateUI() {
        if (yearDisplay) yearDisplay.textContent = selectedYear;
        if (summaryDisplay) {
          summaryDisplay.textContent = `${monthNames[selectedMonth] || selectedMonth} ${selectedYear}`;
        }

        // Update Year Chips styling
        yearChips.forEach(chip => {
          const yr = parseInt(chip.getAttribute('data-year'), 10);
          if (yr === selectedYear) {
            chip.className = "year-chip py-space-sm rounded font-label-md text-label-md text-on-primary bg-primary-container transition-all duration-75 translate-x-0.5 translate-y-0.5";
            chip.style.boxShadow = "inset 2px 2px 0px #00174d, inset -1px -1px 0px #6a96ff";
            chip.textContent = `[ ${yr} ]`;
          } else {
            chip.className = "year-chip py-space-sm rounded font-label-md text-label-md text-on-surface bg-surface-container-lowest transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5";
            chip.style.boxShadow = "2px 2px 0px #1d1c15";
            chip.textContent = `${yr}`;
          }
        });

        // Update Month Cells styling
        monthCells.forEach(cell => {
          const m = cell.getAttribute('data-month');
          if (m === selectedMonth) {
            cell.className = "month-cell h-12 rounded bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center transition-all duration-75 translate-x-0.5 translate-y-0.5";
            cell.style.boxShadow = "inset 2px 2px 0px #00174d, inset -1px -1px 0px #6a96ff";
          } else {
            cell.className = "month-cell h-12 rounded bg-surface-container-low text-on-surface font-headline-sm text-headline-sm flex items-center justify-center transition-all duration-75 active:translate-x-0.5 active:translate-y-0.5";
            cell.style.boxShadow = "2px 2px 0px #1d1c15";
          }
        });
      }

      // Year Stepper Handlers
      document.getElementById('year-prev-btn')?.addEventListener('click', () => {
        selectedYear--;
        updateUI();
      });

      document.getElementById('year-next-btn')?.addEventListener('click', () => {
        selectedYear++;
        updateUI();
      });

      // Year Chip Click Handlers
      yearChips.forEach(chip => {
        chip.addEventListener('click', () => {
          selectedYear = parseInt(chip.getAttribute('data-year'), 10);
          updateUI();
        });
      });

      // Month Cell Click Handlers
      monthCells.forEach(cell => {
        cell.addEventListener('click', () => {
          selectedMonth = cell.getAttribute('data-month');
          updateUI();
        });
      });

      // Quick Jump to Current
      document.getElementById('jump-today-btn')?.addEventListener('click', () => {
        selectedYear = 2025;
        selectedMonth = 'OCT';
        updateUI();
      });

      // Close / Confirm Mock Handlers
      document.getElementById('close-modal-btn')?.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        }
      });

      document.getElementById('confirm-btn')?.addEventListener('click', () => {
        const btn = document.getElementById('confirm-btn');
        if (btn) {
          const originalText = btn.innerHTML;
          btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">done_all</span> [ APPLIED! ]`;
          setTimeout(() => {
            btn.innerHTML = originalText;
            if (window.history.length > 1) {
              window.history.back();
            }
          }, 450);
        }
      });
    })();
  </script>
