<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#dedede" />
  <title>Chrono.exe</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
  <script type="module" src="js/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <img src="icons/app-icon.svg" alt="" class="app-header__icon" width="32" height="32" />
      <div class="app-header__title">
        <span class="app-header__name">CHRONO.EXE</span>
        <span class="app-header__subtitle" id="header-subtitle">Month</span>
      </div>
    </div>
    <div class="app-header__actions">
      <button type="button" id="btn-settings" class="icon-btn icon-btn--raised" aria-label="Open settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/><path d="m10.6 2 .5 2.4c-.7.2-1.3.5-1.9.9L7.2 3.9 3.9 7.2l1.4 2c-.4.6-.7 1.2-.9 1.9L2 10.6v4.8l2.4.5c.2.7.5 1.3.9 1.9l-1.4 2 3.3 3.3 2-1.4c.6.4 1.2.7 1.9.9l.5 2.4h4.8l.5-2.4c.7-.2 1.3-.5 1.9-.9l2 1.4 3.3-3.3-1.4-2c.4-.6.7-1.2.9-1.9l2.4-.5v-4.8l-2.4-.5c-.2-.7-.5-1.3-.9-1.9l1.4-2-3.3-3.3-2 1.4c-.6-.4-1.2-.7-1.9-.9L16.4 2h-4.8Zm1.4 2h1l.4 2.1.9.3c.5.2 1 .4 1.4.7l.8-.5 1.8 1.8-.5.8c.3.4.5.9.7 1.4l.3.9 2.1.4v1l-2.1.4-.3.9c-.2.5-.4 1-.7 1.4l.5.8-1.8 1.8-.8-.5c-.4.3-.9.5-1.4.7l-.3.9-.4 2.1h-1l-.4-2.1-.9-.3c-.5-.2-1-.4-1.4-.7l-.8.5-1.8-1.8.5-.8c-.3-.4-.5-.9-.7-1.4l-.3-.9L4 13.4v-1l2.1-.4.3-.9c.2-.5.4-1 .7-1.4l-.5-.8 1.8-1.8.8.5c.4-.3.9-.5 1.4-.7l.3-.9.4-2.1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view-root" class="view-root" aria-live="polite">
    <section class="placeholder-view raised-plate">
      <h2 class="placeholder-view__title">Chrono.exe booting…</h2>
      <p class="placeholder-view__body">Calendar views arrive in the next milestone.</p>
    </section>
  </main>

  <button type="button" id="btn-fab" class="fab" aria-label="New event">
    <svg class="icon icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
  </button>

  <nav class="bottom-nav" aria-label="Views">
    <button type="button" class="bottom-nav__item" data-view="month" aria-label="Month view">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v3h14V5H5Zm0 5v8h14v-8H5Zm2 2h3v2H7v-2Z" fill-rule="evenodd"/></svg>
      <span class="bottom-nav__label">Month</span>
    </button>
    <button type="button" class="bottom-nav__item" data-view="week" aria-label="Week view">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h5v18H3V3Zm2 2v14h1V5H5Zm4-2h6v18H9V3Zm2 2v14h2V5h-2Zm6-2h4v18h-4V3Zm2 2v14h1V5h-1Z"/></svg>
      <span class="bottom-nav__label">Week</span>
    </button>
    <button type="button" class="bottom-nav__item" data-view="day" aria-label="Day view">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm0 6h18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Zm8 6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h8Z"/></svg>
      <span class="bottom-nav__label">Day</span>
    </button>
    <button type="button" class="bottom-nav__item" data-view="settings" aria-label="Settings">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"/><path d="m10.6 2 .5 2.4c-.7.2-1.3.5-1.9.9L7.2 3.9 3.9 7.2l1.4 2c-.4.6-.7 1.2-.9 1.9L2 10.6v4.8l2.4.5c.2.7.5 1.3.9 1.9l-1.4 2 3.3 3.3 2-1.4c.6.4 1.2.7 1.9.9l.5 2.4h4.8l.5-2.4c.7-.2 1.3-.5 1.9-.9l2 1.4 3.3-3.3-1.4-2c.4-.6.7-1.2.9-1.9l2.4-.5v-4.8l-2.4-.5c-.2-.7-.5-1.3-.9-1.9l1.4-2-3.3-3.3-2 1.4c-.6-.4-1.2-.7-1.9-.9L16.4 2h-4.8Zm1.4 2h1l.4 2.1.9.3c.5.2 1 .4 1.4.7l.8-.5 1.8 1.8-.5.8c.3.4.5.9.7 1.4l.3.9 2.1.4v1l-2.1.4-.3.9c-.2.5-.4 1-.7 1.4l.5.8-1.8 1.8-.8-.5c-.4.3-.9.5-1.4.7l-.3.9-.4 2.1h-1l-.4-2.1-.9-.3c-.5-.2-1-.4-1.4-.7l-.8.5-1.8-1.8.5-.8c-.3-.4-.5-.9-.7-1.4l-.3-.9L4 13.4v-1l2.1-.4.3-.9c.2-.5.4-1 .7-1.4l-.5-.8 1.8-1.8.8.5c.4-.3.9-.5 1.4-.7l.3-.9.4-2.1Z"/></svg>
      <span class="bottom-nav__label">Config</span>
    </button>
  </nav>
</body>
</html>
